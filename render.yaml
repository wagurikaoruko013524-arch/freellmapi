services:
  - type: web
    name: freellmapi
    runtime: docker
    plan: starter

    healthCheckPath: /api/ping

    envVars:
      - key: NODE_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: PORT
        value: 10000

      - key: ENCRYPTION_KEY
        generateValue: true

      - key: PROXY_RATE_LIMIT_RPM
        value: 120

      - key: REQUEST_ANALYTICS_RETENTION_DAYS
        value: 90

      - key: REQUEST_ANALYTICS_MAX_ROWS
        value: 100000

    disk:
      name: freellmapi-data
      mountPath: /app/server/data
      sizeGB: 1